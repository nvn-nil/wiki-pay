<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pay in UPI app</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1a1a1a; --muted: #666; --accent: #5f259f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --card: #1e1e1e; --text: #eee; --muted: #aaa; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { background: var(--card); margin: 16px; padding: 24px; border-radius: 12px; max-width: 420px; width: 100%;
         box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .amt { font-size: 2rem; font-weight: 600; margin: 4px 0; }
  .muted { color: var(--muted); font-size: .9rem; word-break: break-all; }
  a.pay { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none;
          padding: 14px; border-radius: 8px; font-weight: 600; margin-top: 20px; }
  .err { color: #c62828; }
</style>
</head>
<body>
<main id="m"><p>Loading…</p></main>
<script>
// Wiki (a personal butler) sends https://<this page>#<upi://pay?...>. Telegram can't open upi:// links, but it can
// open this page, and the button below hands the payment to the phone's UPI app. Everything after "#" stays in the
// browser: it is never sent to the server hosting this page. This page stores nothing and loads nothing else.
(function () {
  var m = document.getElementById("m");
  var raw = decodeURIComponent(location.hash.slice(1));
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); };
  if (raw.indexOf("upi://pay?") !== 0) {
    m.innerHTML = '<p class="err">This link has no UPI payment in it.</p>';
    return;
  }
  var q = new URLSearchParams(raw.slice("upi://pay?".length));
  var pa = q.get("pa") || "", pn = q.get("pn") || pa, am = q.get("am");
  if (!/^[\w.\-]+@[\w.\-]+$/.test(pa)) {
    m.innerHTML = '<p class="err">The payee in this link doesn\'t look like a UPI ID.</p>';
    return;
  }
  m.innerHTML =
    '<div class="muted">Pay</div>' +
    '<div class="amt">' + (am ? "₹" + esc(Number(am).toLocaleString("en-IN", {minimumFractionDigits: 2})) : "") + "</div>" +
    "<div>to <b>" + esc(pn) + "</b></div>" +
    '<div class="muted">' + esc(pa) + (q.get("tn") ? " · " + esc(q.get("tn")) : "") + "</div>" +
    '<a class="pay" id="go">Open UPI app</a>' +
    '<p class="muted">Check the payee and amount in your UPI app before entering your PIN.</p>';
  document.getElementById("go").href = raw;
})();
</script>
</body>
</html>
